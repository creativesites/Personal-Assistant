name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'db/migrations/**'
      - 'deploy/gcp/**'
      - 'docker-compose.prod.yml'
      - 'docker-compose.gcp.yml'
      - 'nginx.prod.conf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no long-lived GCP keys)

jobs:
  deploy-backend:
    name: Deploy backend to GCP (Compute Engine)
    runs-on: ubuntu-latest
    environment: production
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
    steps:
      - name: Check GCP deploy credentials are configured
        id: guard
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "GCP_WIF_PROVIDER / GCP_DEPLOY_SA not set — skipping deploy (see deploy/gcp/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        if: steps.guard.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.guard.outputs.enabled == 'true'

      - name: Build images and roll out to the VM
        if: steps.guard.outputs.enabled == 'true'
        env:
          PROJECT: propzi-imbk
        run: bash deploy/gcp/deploy.sh
