# Tuned for an 8 GB development machine: one modest daemon, in-process Kotlin compilation,
# two workers. CI may raise these through environment variables.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.useAndroidX=true
# Zuri-wide SDK levels (DECISIONS.md D-15): compile against 37, target 36 (Play requirement), min 29.
zuri.compileSdk=37
zuri.compileSdkMinor=2
zuri.targetSdk=36
zuri.minSdk=29
