# Zuri Android version catalog. Chosen 2026-11-24 from the then-current stable releases.
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
coroutines = "1.10.2"
serialization = "1.13.0"
composeBom = "2026.11.01"
iconsExtended = "1.7.8"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
adaptiveNavSuite = "1.5.0"
coreKtx = "1.18.0"
coreSplash = "1.2.0"
fragment = "1.9.1"
