<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuri Android Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="viewer">
  <header class="vhead">
    <div><h1>Zuri Android · design prototype</h1><p>For product-owner review · 14 journeys · 80+ screens · all data is fictional</p></div>
    <span class="grow"></span>
    <div class="seg-v" role="group" aria-label="Theme">
      <button data-theme-set="system" aria-pressed="true">Auto</button><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>
  <aside class="rail" aria-label="Journeys and screens">
    <div class="tabs"><button id="tab-j" aria-pressed="true">Journeys</button><button id="tab-s" aria-pressed="false">All screens</button></div>
    <div id="rail-body"></div>
  </aside>
  <main class="stage">
    <div class="mpick"><label for="pick" class="small" style="width:100%;color:var(--v-muted)">Journey or screen</label><select id="pick"></select></div>
    <div class="stepbar" id="stepbar" aria-live="polite"></div>
    <div class="phone" id="phone"></div>
  </main>
  <aside class="notes" id="notes" aria-label="Screen notes"></aside>
</div>
<script src="proto-core.js"></script>
<script src="screens-global.js"></script>
<script src="screens-personal.js"></script>
<script src="screens-business.js"></script>
<script src="screens-docs.js"></script>
<script src="screens-ai-sync.js"></script>
<script src="app.js"></script>
</body>
</html>
